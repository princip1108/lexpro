spring.application.name=lexpro-backend

spring.datasource.url=${LEXPRO_DB_URL:jdbc:postgresql://127.0.0.1:5432/lexpro?currentSchema=lexpro}
spring.datasource.username=${LEXPRO_DB_USERNAME:postgres}
spring.datasource.password=${LEXPRO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${LEXPRO_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=lexpro
spring.flyway.schemas=lexpro
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=3
spring.flyway.baseline-description=existing-v3-baseline
spring.flyway.baseline-on-migrate=${LEXPRO_FLYWAY_BASELINE_ON_MIGRATE:false}

mybatis-plus.configuration.map-underscore-to-camel-case=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

lexpro.cors.allowed-origins=${LEXPRO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

lexpro.bootstrap.admin.enabled=${LEXPRO_BOOTSTRAP_ADMIN_ENABLED:false}
lexpro.bootstrap.admin.username=${LEXPRO_BOOTSTRAP_ADMIN_USERNAME:}
lexpro.bootstrap.admin.password=${LEXPRO_BOOTSTRAP_ADMIN_PASSWORD:}
lexpro.bootstrap.admin.real-name=${LEXPRO_BOOTSTRAP_ADMIN_REAL_NAME:System Administrator}
lexpro.bootstrap.admin.organization-code=${LEXPRO_BOOTSTRAP_ORGANIZATION_CODE:LEXPRO}
lexpro.bootstrap.admin.organization-name=${LEXPRO_BOOTSTRAP_ORGANIZATION_NAME:LexPro}

lexpro.jwt.secret=${LEXPRO_JWT_SECRET}
lexpro.jwt.issuer=${LEXPRO_JWT_ISSUER:https://lexpro.local}
lexpro.jwt.access-token-ttl=${LEXPRO_JWT_ACCESS_TOKEN_TTL:PT30M}

lexpro.auth.rate-limit.enabled=${LEXPRO_LOGIN_RATE_LIMIT_ENABLED:true}
lexpro.auth.rate-limit.username-max-attempts=${LEXPRO_LOGIN_USERNAME_MAX_ATTEMPTS:5}
lexpro.auth.rate-limit.address-max-attempts=${LEXPRO_LOGIN_ADDRESS_MAX_ATTEMPTS:100}
lexpro.auth.rate-limit.window=${LEXPRO_LOGIN_RATE_LIMIT_WINDOW:PT5M}
lexpro.auth.rate-limit.block-duration=${LEXPRO_LOGIN_BLOCK_DURATION:PT15M}
lexpro.auth.rate-limit.max-tracked-entries=${LEXPRO_LOGIN_MAX_TRACKED_ENTRIES:10000}

lexpro.dossier.local-root=${LEXPRO_DOSSIER_LOCAL_ROOT:./storage}
lexpro.dossier.max-file-size=${LEXPRO_DOSSIER_MAX_FILE_SIZE:25MB}
lexpro.dossier.allowed-extensions=${LEXPRO_DOSSIER_ALLOWED_EXTENSIONS:pdf,doc,docx,xls,xlsx,ppt,pptx,txt,jpg,jpeg,png}
lexpro.dossier.allowed-content-types=${LEXPRO_DOSSIER_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,image/jpeg,image/png,application/octet-stream}

spring.servlet.multipart.max-file-size=${LEXPRO_DOSSIER_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${LEXPRO_DOSSIER_MAX_REQUEST_SIZE:26MB}

lexpro.processing.core-threads=${LEXPRO_PROCESSING_CORE_THREADS:2}
lexpro.processing.max-threads=${LEXPRO_PROCESSING_MAX_THREADS:4}
lexpro.processing.queue-capacity=${LEXPRO_PROCESSING_QUEUE_CAPACITY:50}
lexpro.processing.max-extracted-chars=${LEXPRO_PROCESSING_MAX_EXTRACTED_CHARS:2000000}
lexpro.processing.stale-after=${LEXPRO_PROCESSING_STALE_AFTER:PT30M}

lexpro.ai.enabled=${LEXPRO_AI_ENABLED:false}
lexpro.ai.base-url=${LEXPRO_AI_BASE_URL:https://api.deepseek.com}
lexpro.ai.api-key=${LEXPRO_AI_API_KEY:}
lexpro.ai.model=${LEXPRO_AI_MODEL:}
lexpro.ai.allow-external-case-data=${LEXPRO_AI_ALLOW_EXTERNAL_CASE_DATA:false}
lexpro.ai.connect-timeout=${LEXPRO_AI_CONNECT_TIMEOUT:PT5S}
lexpro.ai.read-timeout=${LEXPRO_AI_READ_TIMEOUT:PT45S}
lexpro.ai.max-input-chars=${LEXPRO_AI_MAX_INPUT_CHARS:60000}
lexpro.ai.max-output-tokens=${LEXPRO_AI_MAX_OUTPUT_TOKENS:4096}

lexpro.report.pdf-font-path=${LEXPRO_REPORT_PDF_FONT_PATH:}

lexpro.retrieval.enabled=${LEXPRO_RETRIEVAL_ENABLED:false}
lexpro.retrieval.base-url=${LEXPRO_RETRIEVAL_BASE_URL:http://127.0.0.1:8010}
lexpro.retrieval.connect-timeout=${LEXPRO_RETRIEVAL_CONNECT_TIMEOUT:PT3S}
lexpro.retrieval.read-timeout=${LEXPRO_RETRIEVAL_READ_TIMEOUT:PT20S}
lexpro.retrieval.retries=${LEXPRO_RETRIEVAL_RETRIES:1}
lexpro.retrieval.model-name=${LEXPRO_RETRIEVAL_MODEL_NAME:BAAI/bge-m3}
lexpro.retrieval.model-version=${LEXPRO_RETRIEVAL_MODEL_VERSION:main}
lexpro.retrieval.dimension=1024
lexpro.retrieval.distance=cosine

lexpro.mcp.enabled=${LEXPRO_MCP_ENABLED:false}
lexpro.mcp.endpoint=${LEXPRO_MCP_ENDPOINT:/mcp}
lexpro.mcp.request-timeout=${LEXPRO_MCP_REQUEST_TIMEOUT:PT55S}
lexpro.mcp.max-items=${LEXPRO_MCP_MAX_ITEMS:20}
lexpro.mcp.max-output-chars=${LEXPRO_MCP_MAX_OUTPUT_CHARS:50000}
lexpro.mcp.client-registry-path=${LEXPRO_MCP_CLIENT_REGISTRY_PATH:}
lexpro.mcp.token-reload-interval=${LEXPRO_MCP_TOKEN_RELOAD_INTERVAL:PT30S}
lexpro.mcp.max-concurrent-requests=${LEXPRO_MCP_MAX_CONCURRENT_REQUESTS:8}
lexpro.mcp.max-concurrent-per-client=${LEXPRO_MCP_MAX_CONCURRENT_PER_CLIENT:2}
lexpro.mcp.rate-limit-per-minute=${LEXPRO_MCP_RATE_LIMIT_PER_MINUTE:60}

logging.pattern.level=%5p [requestId:%X{requestId:-}]
